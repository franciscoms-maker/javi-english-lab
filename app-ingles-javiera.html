<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Javi's English Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,600&display=swap">
<style>
  :root{
    --bg:#FBF6EE; --bg2:#FFFFFF; --card:#FFFFFF; --ink:#2A2540; --ink-soft:#6A6486;
    --violet:#6B4EFF; --violet-d:#5238e0; --cyan:#12B5C9; --coral:#FF5D8F; --yellow:#FFC542;
    --green:#22C55E; --red:#EF4444; --line:#EBE4D8; --shadow:rgba(64,45,120,.14);
    --ring:rgba(107,78,255,.35);
    --v-soft:#EFEBFF; --c-soft:#DFF6F9; --co-soft:#FFE6EE; --y-soft:#FFF3D6; --g-soft:#DCFCE7;
  }
  :root:not([data-theme="light"]) { }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#171429; --bg2:#1F1B36; --card:#241F40; --ink:#F2EFFF; --ink-soft:#B4ADD6;
      --violet:#9E8BFF; --violet-d:#8b74ff; --cyan:#3AD6E8; --coral:#FF7FA6; --yellow:#FFD066;
      --green:#4ADE80; --red:#F87171; --line:#332C55; --shadow:rgba(0,0,0,.5); --ring:rgba(158,139,255,.5);
      --v-soft:#2C2555; --c-soft:#123840; --co-soft:#3B2436; --y-soft:#3A3016; --g-soft:#15361f;
    }
  }
  :root[data-theme="dark"]{
    --bg:#171429; --bg2:#1F1B36; --card:#241F40; --ink:#F2EFFF; --ink-soft:#B4ADD6;
    --violet:#9E8BFF; --violet-d:#8b74ff; --cyan:#3AD6E8; --coral:#FF7FA6; --yellow:#FFD066;
    --green:#4ADE80; --red:#F87171; --line:#332C55; --shadow:rgba(0,0,0,.5); --ring:rgba(158,139,255,.5);
    --v-soft:#2C2555; --c-soft:#123840; --co-soft:#3B2436; --y-soft:#3A3016; --g-soft:#15361f;
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:'Nunito',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.disp{font-family:'Baloo 2',system-ui,sans-serif;line-height:1.15;letter-spacing:.2px}
  .wrap{max-width:840px;margin:0 auto;padding-inline:18px;padding-block:0}

  /* Top bar */
  .topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
    background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line)}
  .topbar-in{max-width:840px;margin:0 auto;display:flex;align-items:center;gap:12px;
    padding:10px 18px}
  .brand{display:flex;align-items:center;gap:9px;font-family:'Baloo 2';font-weight:800;font-size:19px}
  .brand .logo{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:19px;
    background:linear-gradient(135deg,var(--violet),var(--cyan));box-shadow:0 4px 12px var(--shadow)}
  .spacer{flex:1}
  .stars{display:flex;align-items:center;gap:6px;font-weight:800;color:var(--ink);
    background:var(--y-soft);border:1px solid var(--line);padding:5px 11px;border-radius:999px;font-size:15px}
  .iconbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);width:38px;height:38px;
    border-radius:11px;font-size:17px;cursor:pointer;display:grid;place-items:center}
  .iconbtn:hover{border-color:var(--violet)}

  .backbtn{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--violet);
    font-family:'Baloo 2';font-weight:700;font-size:15px;cursor:pointer;padding:14px 0 4px}

  /* Hero */
  .hero{background:
      radial-gradient(120% 140% at 12% 0%,var(--v-soft),transparent 60%),
      radial-gradient(120% 140% at 90% 8%,var(--c-soft),transparent 55%);
    border:1px solid var(--line);border-radius:26px;padding:24px 22px;margin-top:18px;position:relative;overflow:hidden}
  .hero h1{margin:0 0 4px;font-size:clamp(28px,7vw,42px);color:var(--ink);text-wrap:balance}
  .hero .wave{font-size:1em}
  .hero p{margin:0;color:var(--ink-soft);font-weight:600;max-width:52ch}
  .hero .chip{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:999px;
    padding:5px 13px;font-weight:800;font-size:12.5px;color:var(--violet);margin-bottom:12px;letter-spacing:.3px;text-transform:uppercase}
  .hero-emojis{position:absolute;right:-6px;bottom:-8px;font-size:74px;opacity:.16;line-height:1;transform:rotate(-8deg)}

  /* Progress */
  .prog{margin:16px 0 4px}
  .prog-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
  .prog-top b{font-family:'Baloo 2';font-size:15px}
  .prog-top span{color:var(--ink-soft);font-weight:700;font-size:13px}
  .bar{height:14px;background:var(--line);border-radius:999px;overflow:hidden}
  .bar > i{display:block;height:100%;width:0;border-radius:999px;
    background:linear-gradient(90deg,var(--violet),var(--cyan),var(--coral));transition:width .6s cubic-bezier(.2,.8,.2,1)}

  /* Section grid */
  .sec-title{font-family:'Baloo 2';font-weight:700;font-size:20px;margin:26px 4px 12px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  @media(max-width:540px){.grid{grid-template-columns:1fr}}
  .tile{position:relative;text-align:left;cursor:pointer;border:1px solid var(--line);background:var(--card);
    border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:9px;
    box-shadow:0 6px 18px var(--shadow);transition:transform .15s,box-shadow .15s,border-color .15s;color:inherit}
  .tile:hover{transform:translateY(-3px);box-shadow:0 12px 26px var(--shadow);border-color:transparent}
  .tile:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
  .tile .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:27px}
  .tile h3{margin:2px 0 0;font-size:19px}
  .tile p{margin:0;color:var(--ink-soft);font-weight:600;font-size:13.5px;flex:1}
  .tile .meta{display:flex;align-items:center;gap:8px;font-weight:800;font-size:12.5px;color:var(--ink-soft)}
  .tile .go{position:absolute;top:16px;right:16px;font-family:'Baloo 2';font-weight:800;color:var(--violet);font-size:14px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
  .dot.on{background:var(--green)}
  .tile .tag{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-soft)}
  .badge-done{background:var(--g-soft);color:var(--green);border-radius:999px;padding:2px 9px;font-weight:800;font-size:11.5px}

  .t-voc .ic{background:var(--v-soft)} .t-zero .ic{background:var(--c-soft)}
  .t-pass .ic{background:var(--co-soft)} .t-read .ic{background:var(--y-soft)}
  .t-list .ic{background:var(--g-soft)} .t-test .ic{background:var(--v-soft)}

  /* Lesson / card content */
  .view{padding-bottom:60px}
  .lesson{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;margin-top:6px;
    box-shadow:0 6px 18px var(--shadow)}
  .lesson h2{margin:0 0 10px;font-size:23px;display:flex;align-items:center;gap:10px}
  .lesson h2 .e{font-size:26px}
  .rule{background:var(--v-soft);border:1px solid var(--line);border-left:5px solid var(--violet);
    border-radius:14px;padding:13px 15px;margin:12px 0;font-weight:600}
  .rule.c{background:var(--c-soft);border-left-color:var(--cyan)}
  .rule.co{background:var(--co-soft);border-left-color:var(--coral)}
  .rule b{color:var(--ink)}
  .formula{font-family:'Baloo 2';font-weight:700;background:var(--bg);border:1px dashed var(--line);
    border-radius:12px;padding:10px 12px;text-align:center;margin:8px 0;font-size:15.5px}
  .hl{color:var(--violet);font-weight:800} .hl2{color:var(--coral);font-weight:800} .hl3{color:var(--cyan);font-weight:800}
  .ex{margin:8px 0;padding-left:2px}
  .ex li{margin:5px 0}
  .note{font-size:13.5px;color:var(--ink-soft);font-weight:600}

  /* Quiz */
  .q{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:14px;
    box-shadow:0 6px 18px var(--shadow)}
  .q .qh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}
  .q .qn{font-family:'Baloo 2';font-weight:800;color:var(--violet);font-size:14px}
  .q .qtype{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-soft);
    background:var(--bg);border:1px solid var(--line);padding:3px 9px;border-radius:999px}
  .q .qtext{font-size:17px;font-weight:700;margin:6px 0 14px;line-height:1.4}
  .q .qtext .blank{display:inline-block;min-width:64px;border-bottom:3px dotted var(--violet);text-align:center;color:var(--violet)}
  .opts{display:flex;flex-direction:column;gap:9px}
  .opt{display:flex;align-items:center;gap:11px;text-align:left;border:2px solid var(--line);background:var(--bg2);
    color:var(--ink);border-radius:14px;padding:12px 14px;font-size:15.5px;font-weight:700;cursor:pointer;
    transition:border-color .12s,background .12s,transform .08s;width:100%}
  .opt:hover:not(:disabled){border-color:var(--violet)}
  .opt:active:not(:disabled){transform:scale(.99)}
  .opt .key{width:26px;height:26px;flex:none;border-radius:8px;background:var(--v-soft);color:var(--violet);
    display:grid;place-items:center;font-family:'Baloo 2';font-weight:800;font-size:14px}
  .opt.correct{border-color:var(--green);background:var(--g-soft)}
  .opt.correct .key{background:var(--green);color:#fff}
  .opt.wrong{border-color:var(--red);background:var(--co-soft)}
  .opt.wrong .key{background:var(--red);color:#fff}
  .opt:disabled{cursor:default}

  .typed{display:flex;gap:9px;flex-wrap:wrap}
  .typed input{flex:1;min-width:160px;border:2px solid var(--line);background:var(--bg2);color:var(--ink);
    border-radius:13px;padding:12px 14px;font-size:16px;font-weight:700;font-family:inherit}
  .typed input:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 4px var(--ring)}
  .typed input.correct{border-color:var(--green);background:var(--g-soft)}
  .typed input.wrong{border-color:var(--red);background:var(--co-soft)}
  .btn{border:none;border-radius:13px;padding:12px 18px;font-family:'Baloo 2';font-weight:800;font-size:15px;
    cursor:pointer;background:var(--violet);color:#fff;box-shadow:0 4px 12px var(--shadow);transition:transform .08s,filter .12s}
  .btn:hover{filter:brightness(1.06)} .btn:active{transform:scale(.98)}
  .btn.ghost{background:var(--card);color:var(--violet);border:2px solid var(--line);box-shadow:none}
  .btn.small{padding:9px 14px;font-size:14px}
  .btn:disabled{opacity:.5;cursor:default}

  .fb{margin-top:12px;border-radius:13px;padding:11px 14px;font-weight:700;font-size:14.5px;display:none;align-items:flex-start;gap:9px}
  .fb.show{display:flex}
  .fb.ok{background:var(--g-soft);color:var(--green)}
  .fb.no{background:var(--co-soft);color:var(--red)}
  .fb .em{font-size:19px;line-height:1.2}
  .fb small{display:block;color:var(--ink-soft);font-weight:700;margin-top:3px}

  /* Flashcards */
  .fc-stage{perspective:1200px;margin-top:6px}
  .fc{width:100%;min-height:210px;position:relative;transform-style:preserve-3d;transition:transform .5s;cursor:pointer}
  .fc.flip{transform:rotateY(180deg)}
  .fc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;border:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;text-align:center;
    box-shadow:0 8px 22px var(--shadow)}
  .fc-front{background:linear-gradient(150deg,var(--v-soft),var(--c-soft))}
  .fc-back{background:var(--card);transform:rotateY(180deg)}
  .fc .emoji{font-size:62px;line-height:1}
  .fc .word{font-family:'Baloo 2';font-weight:800;font-size:30px;color:var(--ink)}
  .fc .pos{font-size:13px;font-weight:800;color:var(--violet);text-transform:uppercase;letter-spacing:.5px}
  .fc .es{font-family:'Baloo 2';font-weight:800;font-size:24px;color:var(--coral)}
  .fc .def{color:var(--ink-soft);font-weight:600;max-width:34ch}
  .fc .tapnote{font-size:12px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px}
  .fc-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
  .fc-count{font-family:'Baloo 2';font-weight:800;color:var(--ink-soft)}

  /* Reading */
  .story{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:6px;box-shadow:0 6px 18px var(--shadow)}
  .story h2{margin:0 0 3px;font-size:22px}
  .story .by{color:var(--ink-soft);font-weight:700;font-size:13px;margin-bottom:10px}
  .story p{margin:9px 0;font-size:15.5px}
  .story .glo{margin-top:12px;font-size:13px;color:var(--ink-soft);font-weight:600;background:var(--bg);
    border:1px dashed var(--line);border-radius:12px;padding:10px 12px}
  mark{background:var(--y-soft);color:var(--ink);border-radius:5px;padding:0 3px;font-weight:800}

  /* Listening */
  .player{display:flex;align-items:center;gap:14px;background:linear-gradient(150deg,var(--v-soft),var(--c-soft));
    border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:6px}
  .playbtn{width:64px;height:64px;flex:none;border-radius:50%;border:none;cursor:pointer;color:#fff;font-size:26px;
    background:linear-gradient(135deg,var(--violet),var(--cyan));box-shadow:0 6px 16px var(--shadow);display:grid;place-items:center}
  .playbtn:active{transform:scale(.96)}
  .player .pt{font-weight:800;font-family:'Baloo 2'} .player .ps{font-size:13px;color:var(--ink-soft);font-weight:700}
  .speedrow{display:flex;gap:8px;align-items:center;margin-top:10px;font-weight:700;font-size:13px;color:var(--ink-soft);flex-wrap:wrap}
  .pill{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 12px;font-weight:800;cursor:pointer;font-size:13px}
  .pill.on{border-color:var(--violet);color:var(--violet);background:var(--v-soft)}
  .warn{background:var(--y-soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:700;font-size:13.5px;margin-top:10px}

  /* Result */
  .result{text-align:center;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:26px 20px;
    margin-top:10px;box-shadow:0 10px 26px var(--shadow)}
  .result .big{font-size:70px;line-height:1;margin-bottom:6px}
  .result h2{font-size:26px;margin:0 0 6px}
  .result .score{font-family:'Baloo 2';font-weight:800;font-size:20px;color:var(--violet);margin:4px 0 2px}
  .result p{color:var(--ink-soft);font-weight:700;margin:6px 0 16px}
  .result .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .starburst{display:inline-flex;gap:5px;font-size:30px;margin:6px 0}

  /* Banners (review / exam) */
  .banner{width:100%;text-align:left;cursor:pointer;border:1px solid var(--line);border-radius:20px;padding:15px 17px;
    display:flex;align-items:center;gap:13px;margin-top:14px;color:var(--ink);box-shadow:0 6px 18px var(--shadow);
    transition:transform .15s,box-shadow .15s}
  .banner:hover{transform:translateY(-2px);box-shadow:0 12px 26px var(--shadow)}
  .banner:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
  .banner .bic{width:48px;height:48px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:26px;background:var(--card)}
  .banner .btxt{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0}
  .banner .btxt b{font-family:'Baloo 2';font-size:17px}
  .banner .btxt small{color:var(--ink-soft);font-weight:700;font-size:12.5px}
  .banner .bgo{font-family:'Baloo 2';font-weight:800;color:var(--violet);font-size:14px;flex:none}
  .banner-rev{background:linear-gradient(120deg,var(--y-soft),var(--co-soft))}
  .banner-exam{background:linear-gradient(120deg,var(--v-soft),var(--c-soft))}

  /* Exam mode */
  .opt.sel{border-color:var(--violet);background:var(--v-soft)}
  .opt.sel .key{background:var(--violet);color:#fff}
  .exambar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:10;display:flex;justify-content:space-between;
    align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 16px;margin-bottom:12px;
    font-family:'Baloo 2';font-weight:800;box-shadow:0 4px 12px var(--shadow)}
  .exambar span:first-child{font-size:18px;color:var(--violet)}
  .grade{font-family:'Baloo 2';font-weight:800;font-size:64px;line-height:1;margin:2px 0}

  .foot{text-align:center;color:var(--ink-soft);font-weight:700;font-size:12.5px;padding:24px 0 8px}
  .confetti{position:fixed;top:-10px;width:11px;height:16px;z-index:60;pointer-events:none;border-radius:2px}

  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="topbar">
  <div class="topbar-in">
    <div class="brand"><span class="logo">💻</span><span>Javi's English Lab</span></div>
    <div class="spacer"></div>
    <div class="stars" title="Estrellas ganadas">⭐ <span id="starCount">0</span></div>
    <button class="iconbtn" id="themeBtn" title="Cambiar tema" aria-label="Cambiar tema">🌙</button>
  </div>
</div>

<main class="wrap view" id="app"></main>
<div class="foot wrap">Unit 6 · Let's Connect · Hecho con 💜 para Javiera · 6th Grade</div>

<script>
/* ---------------- Persistence ---------------- */
const STORE='javi_english_v1';
let state={stars:0,done:{},best:{},mistakes:[]};
try{const s=localStorage.getItem(STORE);if(s)state=Object.assign(state,JSON.parse(s));}catch(e){}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state));}catch(e){}}
function setStars(){document.getElementById('starCount').textContent=state.stars;}

/* Theme */
(function(){
  const btn=document.getElementById('themeBtn');
  function cur(){return document.documentElement.getAttribute('data-theme');}
  function paint(){btn.textContent = (cur()==='dark') ? '☀️' : (cur()==='light'?'🌙': (matchMedia('(prefers-color-scheme:dark)').matches?'☀️':'🌙'));}
  btn.onclick=()=>{const isDark = cur()==='dark' || (!cur() && matchMedia('(prefers-color-scheme:dark)').matches);
    document.documentElement.setAttribute('data-theme', isDark?'light':'dark');paint();};
  paint();
})();

/* ---------------- Data ---------------- */
const VOCAB=[
  {w:'download',e:'⬇️',pos:'verb',es:'descargar',def:'To copy a file or app from the internet to your device.'},
  {w:'upload',e:'⬆️',pos:'verb',es:'subir',def:'To send a file from your device to the internet.'},
  {w:'install',e:'🧩',pos:'verb',es:'instalar',def:'To add a new program or app to a device.'},
  {w:'website',e:'🌐',pos:'noun',es:'sitio web',def:'A page or group of pages on the internet.'},
  {w:'password',e:'🔒',pos:'noun',es:'contraseña',def:'A secret word or code you use to log in.'},
  {w:'app',e:'📱',pos:'noun',es:'aplicación',def:'A program you use on a phone or tablet.'},
  {w:'online',e:'📶',pos:'adj/adv',es:'en línea / conectado',def:'Connected to the internet.'},
  {w:'social media',e:'💬',pos:'noun',es:'redes sociales',def:'Apps where people share posts and photos.'},
  {w:'selfie',e:'🤳',pos:'noun',es:'autofoto',def:'A photo you take of yourself.'},
  {w:'headphones',e:'🎧',pos:'noun',es:'audífonos',def:'You wear them to listen to sound privately.'},
  {w:'emoji',e:'😄',pos:'noun',es:'emoji',def:'A small picture used in messages to show feelings.'},
  {w:'screen',e:'🖥️',pos:'noun',es:'pantalla',def:'The flat part of a device that shows images.'},
  {w:'smartwatch',e:'⌚',pos:'noun',es:'reloj inteligente',def:'A watch that connects to the internet and apps.'},
  {w:'track',e:'📍',pos:'verb',es:'rastrear / seguir',def:'To follow where something or someone is.'},
  {w:'swipe',e:'👉',pos:'verb',es:'deslizar',def:'To move your finger across a touch screen.'},
  {w:'save',e:'💾',pos:'verb',es:'guardar',def:'To keep a file so you can use it later.'},
  {w:'delete',e:'🗑️',pos:'verb',es:'borrar / eliminar',def:'To remove a file or text.'},
  {w:'restart',e:'🔄',pos:'verb',es:'reiniciar',def:'To turn a device off and on again.'},

/* ---------------- Helpers ---------------- */
const app=document.getElementById('app');
let examTimer=null;
function el(h){const d=document.createElement('div');d.innerHTML=h.trim();return d.firstElementChild;}
function norm(s){return (s||'').toLowerCase().replace(/[.,;!?"']/g,'').replace(/\s+/g,' ').trim();}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function scrollTop(){window.scrollTo({top:0,behavior:'smooth'});}

function confetti(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const cols=['#6B4EFF','#12B5C9','#FF5D8F','#FFC542','#22C55E'];
  for(let i=0;i<60;i++){
    const c=document.createElement('div');c.className='confetti';
    c.style.left=Math.random()*100+'vw';c.style.background=cols[i%cols.length];
    c.style.transform=`rotate(${Math.random()*360}deg)`;
    const dur=2200+Math.random()*1500;
    c.animate([{transform:`translateY(0) rotate(0)`,opacity:1},{transform:`translateY(${window.innerHeight+40}px) rotate(${720*(Math.random()>.5?1:-1)}deg)`,opacity:.9}],{duration:dur,easing:'cubic-bezier(.3,.6,.4,1)'});
    document.body.appendChild(c);setTimeout(()=>c.remove(),dur);
  }
}
function awardStars(n){state.stars+=n;save();setStars();}
function qKey(it){return (it.q||it.text||'').slice(0,140);}
function cleanQ(it){const c=Object.assign({},it);delete c._order;return c;}
function addMistake(it,sec){const k=qKey(it);if(!state.mistakes.some(m=>qKey(m)===k)){const c=cleanQ(it);c._sec=sec;state.mistakes.push(c);}save();}
function removeMistake(it){const k=qKey(it);const n=state.mistakes.length;state.mistakes=state.mistakes.filter(m=>qKey(m)!==k);if(state.mistakes.length!==n)save();}

        <h3>${s.title}</h3>

          <span class="dot ${done?'on':''}"></span>

        </span>
      </button>`);
    t.onclick=()=>open(s.id);
    grid.appendChild(t);
  });
  app.appendChild(grid);
  const eb=el(`<button class="banner banner-exam"><span class="bic">🎯</span><span class="btxt"><b>Simulacro de prueba</b><small>Examen cronometrado ⏱️ · con nota (1,0–7,0)</small></span><span class="bgo">Empezar →</span></button>`);
  eb.onclick=renderExam; app.appendChild(eb);

/* ---------------- Generic quiz engine ---------------- */
/* questions: array of {type, ...}. onDone(score,total,secId) */
function runQuiz(container,questions,secId,titleHtml){
  let i=0,score=0;const missed=[];
  const box=el('<div></div>');
  container.appendChild(box);
  function progress(){return `<div class="qh"><span class="qn">Pregunta ${i+1} de ${questions.length}</span><span class="qtype">⭐ ${score}</span></div>`;}

  function showResult(){
    const pct=Math.round(score/questions.length*100);
    let emoji,msg;
    if(pct===100){emoji='🏆';msg='¡PERFECTO! Eres una crack del inglés.';}
    else if(pct>=80){emoji='🌟';msg='¡Excelente! Casi perfecto.';}
    else if(pct>=60){emoji='😄';msg='¡Bien! Repasa lo que fallaste y vuelve a intentar.';}
    else {emoji='💪';msg='¡Sigue practicando! Inténtalo de nuevo, tú puedes.';}
    const trackable=SECTIONS.some(s=>s.id===secId);
    const first=trackable && (!state.done[secId] || (state.best[secId]||0)<score);
    if(first){state.done[secId]=true;state.best[secId]=score;
      const gained = pct===100?3:pct>=60?2:1; awardStars(gained);}
    else {save();}
    if(pct>=80)confetti();
    box.innerHTML='';
    const r=el(`
      <div class="result">
        <div class="big">${emoji}</div>
        <h2>${msg}</h2>
        <div class="starburst">${'⭐'.repeat(pct===100?3:pct>=60?2:1)}</div>
        <div class="score">Puntaje: ${score} / ${questions.length} (${pct}%)</div>
        <p>${first?'¡Ganaste estrellas nuevas! ⭐':'¡Buen repaso! 💪'}</p>
        <div class="row">
          ${missed.length?`<button class="btn" id="rev">🔁 Repasar los que fallé (${missed.length})</button>`:''}
          <button class="btn ${missed.length?'ghost':''}" id="retry">↩︎ Reintentar todo</button>
          <button class="btn ghost" id="home">🏠 Inicio</button>
        </div>
      </div>`);
    r.querySelector('#retry').onclick=()=>{i=0;score=0;missed.length=0;render();scrollTop();};
    r.querySelector('#home').onclick=renderHome;
    const revBtn=r.querySelector('#rev');
    if(revBtn)revBtn.onclick=()=>{box.innerHTML='';runQuiz(box,missed.map(x=>Object.assign({},x)),secId+'_rev');};
    box.appendChild(r);
    scrollTop();
  }

  function next(correct){
    const item=questions[i];
    if(correct){score++;removeMistake(item);}
    else{missed.push(cleanQ(item));addMistake(item,secId);}
    i++;
    if(i>=questions.length)showResult(); else render();
  }

  function render(){
    const item=questions[i];
    box.innerHTML='';
    const card=el(`<div class="q">${progress()}</div>`);

    if(item.type==='mc'){
      card.appendChild(el(`<div class="qtext">${item.q}</div>`));
      const opts=el('<div class="opts"></div>');
      const order=item._order||(item._order=shuffle(item.opts.map((o,ix)=>ix)));
      order.forEach((realIx,pos)=>{
        const o=el(`<button class="opt"><span class="key">${String.fromCharCode(65+pos)}</span><span>${item.opts[realIx]}</span></button>`);
        o.onclick=()=>choose(o,realIx===item.a,opts,item);
        opts.appendChild(o);
      });
      card.appendChild(opts);
    }
    else if(item.type==='gap'){
      card.appendChild(el(`<div class="qtext">${item.q.replace(/____/g,'<span class="blank">?</span>')}</div>`));
      const opts=el('<div class="opts"></div>');
      const order=item._order||(item._order=shuffle(item.opts.map((o,ix)=>ix)));
      order.forEach((realIx,pos)=>{
        const label=item.opts[realIx].join('  /  ');
        const o=el(`<button class="opt"><span class="key">${String.fromCharCode(65+pos)}</span><span>${label}</span></button>`);
        o.onclick=()=>choose(o,realIx===item.a,opts,item);
        opts.appendChild(o);
      });
      card.appendChild(opts);
    }
    else if(item.type==='fill'){
      card.appendChild(el(`<div class="qtext">${item.q}</div>`));
      const row=el(`<div class="typed"><input type="text" placeholder="Escribe aquí..." autocomplete="off" autocorrect="off" spellcheck="false"><button class="btn">Revisar</button></div>`);
      const input=row.querySelector('input');const btn=row.querySelector('button');
      const check=()=>{
        const ok=item.accept.map(norm).includes(norm(input.value));
        input.classList.add(ok?'correct':'wrong');input.disabled=true;btn.disabled=true;
        feedback(card,ok,item.fb,ok?null:('Respuesta: '+item.accept[0]));
        addNext(card,ok);
      };
      btn.onclick=check;
      input.addEventListener('keydown',e=>{if(e.key==='Enter')check();});
      card.appendChild(row);
      setTimeout(()=>input.focus(),50);
    }
    else if(item.type==='order'){
      card.appendChild(el(`<div class="qtext">${item.q}</div>`));
      const chosen=[];
      const built=el('<div class="typed" style="min-height:52px;border:2px dashed var(--line);border-radius:13px;padding:10px;align-items:center"></div>');
      const builtText=el('<div style="font-family:Baloo 2;font-weight:700;font-size:16px;color:var(--violet);flex:1">Toca las palabras en orden...</div>');
      built.appendChild(builtText);
      const bank=el('<div class="typed" style="margin-top:10px"></div>');
      const tokens=shuffle(item.tokens);
      const btns=[];
      function refresh(){builtText.textContent=chosen.length?chosen.join(' '):'Toca las palabras en orden...';}
      tokens.forEach((tk,ix)=>{
        const tb=el(`<button class="pill">${tk}</button>`);
        tb.onclick=()=>{if(tb.disabled)return;chosen.push(tk);tb.disabled=true;tb.style.opacity=.4;refresh();};
        btns.push(tb);bank.appendChild(tb);
      });
      const ctrl=el('<div class="typed" style="margin-top:10px"><button class="btn">Revisar</button><button class="btn ghost small">↩︎ Borrar</button></div>');
      ctrl.children[0].onclick=()=>{
        const ok=norm(chosen.join(' '))===norm(item.answer);
        built.style.borderColor=ok?'var(--green)':'var(--red)';
        built.style.background=ok?'var(--g-soft)':'var(--co-soft)';
        ctrl.children[0].disabled=true;ctrl.children[1].disabled=true;btns.forEach(b=>b.disabled=true);
        feedback(card,ok,item.fb,ok?null:('Orden correcto: '+item.answer));
        addNext(card,ok);
      };
      ctrl.children[1].onclick=()=>{chosen.length=0;btns.forEach(b=>{b.disabled=false;b.style.opacity=1;});refresh();};
      card.appendChild(built);card.appendChild(bank);card.appendChild(ctrl);
    }

    box.appendChild(card);
  }

  function choose(clicked,correct,opts,item){
    [...opts.children].forEach(o=>o.disabled=true);
    clicked.classList.add(correct?'correct':'wrong');
    if(!correct){
      // reveal correct one
      const order=item._order;
      const pos=order.indexOf(item.a);
      if(pos>=0)opts.children[pos].classList.add('correct');
    }
    feedback(box.querySelector('.q'),correct,item.fb);
    addNext(box.querySelector('.q'),correct);
  }

  function feedback(card,ok,fb,extra){
    const f=el(`<div class="fb ${ok?'ok':'no'} show"><span class="em">${ok?'🎉':'🤔'}</span><span>${ok?'¡Correcto!':'Casi...'} ${fb?('<small>'+fb+'</small>'):''}${extra?('<small>'+extra+'</small>'):''}</span></div>`);
    card.appendChild(f);
  }
  function addNext(card,ok){
    const last=i===questions.length-1;
    const nb=el(`<div style="margin-top:14px;display:flex;justify-content:flex-end"><button class="btn">${last?'Ver resultado 🏁':'Siguiente →'}</button></div>`);
    nb.querySelector('button').onclick=()=>next(ok);
    card.appendChild(nb);
    nb.querySelector('button').scrollIntoView({behavior:'smooth',block:'nearest'});
  }

  render();
}

/* ---------------- Listening ---------------- */
function renderListening(){
  app.innerHTML='';
  app.appendChild(backBtn());
  app.appendChild(el(`<div class="sec-title" style="margin-top:6px">🎧 Listening</div>`));
  const supported = 'speechSynthesis' in window;
  if(!supported){
    app.appendChild(el(`<div class="warn">⚠️ Tu navegador no puede reproducir voz. Prueba en Chrome o Safari con el volumen activado. Igual puedes leer las frases y responder.</div>`));
  }
  app.appendChild(el(`<div class="note" style="margin:0 4px 8px">Sube el <b>volumen</b> 🔊. Toca <b>▶️ Play</b> para escuchar. Puedes repetir las veces que quieras y luego responder.</div>`));

  let rate=0.9;
  let i=0,score=0;
  const box=el('<div></div>');app.appendChild(box);

  function speak(text){
    try{
      window.speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text);
      u.lang='en-US';u.rate=rate;u.pitch=1;
      const voices=window.speechSynthesis.getVoices();
      const en=voices.find(v=>/en[-_]/i.test(v.lang)&&/US|GB|female|Samantha|Google/i.test(v.name))||voices.find(v=>/en[-_]/i.test(v.lang));
      if(en)u.voice=en;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }

  function result(){
    const pct=Math.round(score/Q_LISTEN.length*100);
    let emoji=pct===100?'🏆':pct>=80?'🌟':pct>=60?'😄':'💪';
    let msg=pct>=80?'¡Súper oído! 👂':pct>=60?'¡Bien! Escucha de nuevo las que fallaste.':'¡Practica escuchando otra vez, tú puedes!';
    const first=!state.done.listen || (state.best.listen||0)<score;
    if(first){state.done.listen=true;state.best.listen=score;awardStars(pct===100?3:pct>=60?2:1);}else save();
    if(pct>=80)confetti();
    box.innerHTML='';
    const r=el(`<div class="result"><div class="big">${emoji}</div><h2>${msg}</h2>
      <div class="starburst">${'⭐'.repeat(pct===100?3:pct>=60?2:1)}</div>
      <div class="score">Puntaje: ${score} / ${Q_LISTEN.length} (${pct}%)</div>
      <div class="row"><button class="btn" id="rt">🔁 Reintentar</button><button class="btn ghost" id="hm">🏠 Inicio</button></div></div>`);
    r.querySelector('#rt').onclick=()=>{i=0;score=0;render();};
    r.querySelector('#hm').onclick=renderHome;
    box.appendChild(r);scrollTop();
  }

  function render(){
    if(i>=Q_LISTEN.length){result();return;}
    const item=Q_LISTEN[i];
    box.innerHTML='';
    const card=el(`<div class="q"><div class="qh"><span class="qn">Audio ${i+1} de ${Q_LISTEN.length}</span><span class="qtype">⭐ ${score}</span></div></div>`);
    const player=el(`<div class="player">
        <button class="playbtn" title="Escuchar">▶️</button>
        <div><div class="pt">Toca para escuchar</div><div class="ps">Puedes repetir las veces que quieras</div></div>
      </div>`);
    player.querySelector('.playbtn').onclick=()=>{speak(item.text);};
    card.appendChild(player);
    const speed=el(`<div class="speedrow">Velocidad:
      <button class="pill" data-r="0.7">🐢 Lenta</button>
      <button class="pill on" data-r="0.9">🚶 Normal</button>
      <button class="pill" data-r="1">🏃 Rápida</button>
      <button class="pill" id="repeat">🔁 Repetir</button></div>`);
    speed.querySelectorAll('[data-r]').forEach(p=>p.onclick=()=>{rate=parseFloat(p.dataset.r);speed.querySelectorAll('[data-r]').forEach(x=>x.classList.remove('on'));p.classList.add('on');speak(item.text);});
    speed.querySelector('#repeat').onclick=()=>speak(item.text);
    card.appendChild(speed);

    card.appendChild(el(`<div class="qtext" style="margin-top:16px">${item.q}</div>`));
    const opts=el('<div class="opts"></div>');
    const order=shuffle(item.opts.map((o,ix)=>ix));
    order.forEach((realIx,pos)=>{
      const o=el(`<button class="opt"><span class="key">${String.fromCharCode(65+pos)}</span><span>${item.opts[realIx]}</span></button>`);
      o.onclick=()=>{
        [...opts.children].forEach(x=>x.disabled=true);
        const ok=realIx===item.a;
        o.classList.add(ok?'correct':'wrong');
        if(!ok){const p=order.indexOf(item.a);opts.children[p].classList.add('correct');}
        const f=el(`<div class="fb ${ok?'ok':'no'} show"><span class="em">${ok?'🎉':'🤔'}</span><span>${ok?'¡Correcto!':'Casi...'} <small>${item.fb}</small><small>📝 Frase: "${item.text}"</small></span></div>`);
        card.appendChild(f);
        const last=i===Q_LISTEN.length-1;
        const nb=el(`<div style="margin-top:14px;display:flex;justify-content:flex-end"><button class="btn">${last?'Ver resultado 🏁':'Siguiente →'}</button></div>`);
        nb.querySelector('button').onclick=()=>{if(ok)score++;i++;render();};
        card.appendChild(nb);
      };
      opts.appendChild(o);
    });
    card.appendChild(opts);
    box.appendChild(card);
    scrollTop();
  }
  if(supported && window.speechSynthesis.getVoices().length===0){window.speechSynthesis.onvoiceschanged=()=>{};}
  render();
}

  const questions=shuffle(rpool).slice(0,15).map(q=>Object.assign({},q,{_order:null}));
  const given=new Array(questions.length).fill(null);
  let idx=0, left=15*60;
  const wrap=el('<div></div>');app.appendChild(wrap);

  function fmt(s){const m=Math.floor(s/60),ss=s%60;return m+':'+(ss<10?'0':'')+ss;}

      left--;

  function intro(){
    clearInterval(examTimer);
    wrap.innerHTML='';
    wrap.appendChild(el(`
      <div class="hero" style="margin-top:6px">
        <span class="chip">🎯 Simulacro de prueba</span>
        <h1 style="font-size:clamp(24px,6vw,34px)">¿Lista, Javiera?</h1>
        <p>Son <b>${questions.length} preguntas</b> mezcladas de toda la Unit 6. Tienes <b>15 minutos</b> ⏱️. Aquí <b>no</b> te digo si están bien hasta el final, como en la prueba de verdad. Al terminar recibes tu <b>nota (1,0–7,0)</b>.</p>
      </div>`));
    const go=el(`<div style="margin-top:16px;display:flex;justify-content:center"><button class="btn" style="font-size:17px;padding:14px 28px">▶️ Empezar simulacro</button></div>`);

    wrap.appendChild(go);

  function render(){
    const item=questions[idx];
    wrap.innerHTML='';
    wrap.appendChild(el(`<div class="exambar"><span id="examClock">⏱️ ${fmt(left)}</span><span>Pregunta ${idx+1}/${questions.length}</span></div>`));
    const card=el(`<div class="q"></div>`);
    const qtext=(item.type==='gap')?item.q.replace(/____/g,'<span class="blank">?</span>'):item.q;
    card.appendChild(el(`<div class="qtext">${qtext}</div>`));
    if(item.type==='fill'){
      const row=el(`<div class="typed"><input type="text" placeholder="Escribe tu respuesta..." autocomplete="off" autocorrect="off" spellcheck="false"></div>`);
      const inp=row.querySelector('input');if(given[idx]!=null)inp.value=given[idx];
      inp.oninput=()=>given[idx]=inp.value;
      card.appendChild(row);
    } else {
      const opts=el('<div class="opts"></div>');
      const order=item._order||(item._order=shuffle(item.opts.map((o,ix)=>ix)));
      order.forEach((realIx,pos)=>{
        const label=(item.type==='gap')?item.opts[realIx].join('  /  '):item.opts[realIx];
        const o=el(`<button class="opt${given[idx]===realIx?' sel':''}"><span class="key">${String.fromCharCode(65+pos)}</span><span>${label}</span></button>`);
        o.onclick=()=>{given[idx]=realIx;[...opts.children].forEach(x=>x.classList.remove('sel'));o.classList.add('sel');};
        opts.appendChild(o);
      });
      card.appendChild(opts);
    }
    const nav=el(`<div style="margin-top:16px;display:flex;justify-content:space-between;gap:10px">
      <button class="btn ghost small" ${idx===0?'disabled':''} id="prev">← Anterior</button>
      <button class="btn" id="nx">${idx===questions.length-1?'Terminar 🏁':'Siguiente →'}</button></div>`);
    nav.querySelector('#prev').onclick=()=>{if(idx>0){idx--;render();}};
    nav.querySelector('#nx').onclick=()=>{if(idx===questions.length-1)finish();else{idx++;render();}};
    card.appendChild(nav);
    wrap.appendChild(card);
    scrollTop();
  }

  function isCorrect(item,g){
    if(g==null||g==='')return false;
    if(item.type==='fill')return item.accept.map(norm).includes(norm(g));
    return g===item.a;
  }

  function finish(){
    clearInterval(examTimer);
    let score=0;const wrong=[];
    questions.forEach((item,ix)=>{const ok=isCorrect(item,given[ix]);if(ok)score++;else{wrong.push(cleanQ(item));addMistake(item,'exam');}});
    const total=questions.length,pct=score/total;
    let nota = pct>=0.6 ? 4.0+(pct-0.6)/0.4*3.0 : 1.0+pct/0.6*3.0;
    nota=Math.round(nota*10)/10;
    const timeUsed=15*60-left, pass=nota>=4.0;
    if(pass)confetti();
    wrap.innerHTML='';
    const notaStr=nota.toFixed(1).replace('.',',');
    wrap.appendChild(el(`
      <div class="result">
        <div class="big">${pass?'🎉':'📚'}</div>
        <h2>${pass?'¡Aprobaste el simulacro!':'¡A repasar un poco más!'}</h2>
        <div class="grade" style="color:${pass?'var(--green)':'var(--red)'}">${notaStr}</div>
        <div class="score">${score} / ${total} correctas (${Math.round(pct*100)}%) · ⏱️ ${fmt(timeUsed)}</div>
        <p>${pass?'¡Vas muy bien para la prueba! 💪':'Tranquila, esto es práctica. Repasa y vuelve a intentar. 💜'}</p>
        <div class="row">
          ${wrong.length?`<button class="btn" id="rev">🔁 Repasar los que fallé (${wrong.length})</button>`:''}
          <button class="btn ${wrong.length?'ghost':''}" id="again">↩︎ Otro simulacro</button>
          <button class="btn ghost" id="hm">🏠 Inicio</button>
        </div>
      </div>`));
    const rb=wrap.querySelector('#rev');if(rb)rb.onclick=()=>{wrap.innerHTML='';runQuiz(wrap,wrong.map(x=>Object.assign({},x)),'exam_rev');};
    wrap.querySelector('#again').onclick=renderExam;
    wrap.querySelector('#hm').onclick=renderHome;
    scrollTop();
  }

  intro();
}

/* ---------------- Boot ---------------- */
setStars();
renderHome();
</script>
